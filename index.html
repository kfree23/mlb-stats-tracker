<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLB Stats Tracker — Slugger</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="app.css">
    <script defer src="script.js"></script>
    <!-- <script defer src="leaderboard.js"></script> -->
</head>

<body>

    <div class="app">

        <!-- Header -->
        <header class="header">
            <div class="brand">
                <span class="glyph">S</span>
                <h1>MLB Stats Tracker</h1>
            </div>
            <p id="players-tracked">0 players tracked</p>
        </header>

        <!-- Player Input -->
        <div class="input-player">
            <input type="text" id="input-player" placeholder="Enter player name">
            <input type="text" id="input-team" placeholder="Enter player team">
            <input type="text" id="input-position" placeholder="Enter player position">
            <button id="submit">Add Player</button>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <ul>
                <li class="active" data-tab="player-cards"><button>Player Cards</button></li>
                <li data-tab="leaderboard"><button>Leaderboard</button></li>
            </ul>
        </div>

        <!-- Player Cards -->
        <div class="player-card-container">
            <div class="player-grid" id="player-cards"></div>
        </div>

        <!-- Leaderboard -->
        <div class="leaderboard-view" id="leaderboard-view" hidden>
            <div class="lb-toolbar">
                <h2 class="lb-title">League<br>Leaders</h2>
                <div class="lb-sort" id="lb-sort"></div>
            </div>

            <div class="lb-head">
                <span>#</span>
                <span>Player</span>
                <span class="num">HR</span>
                <span class="num">H</span>
                <span class="num">RBI</span>
                <span class="num">R</span>
            </div>

            <div id="leaderboard-container"></div>
        </div>

        <!-- Log Game Modal -->
        <dialog class="log-game-container" id="log-game-modal">
            <div class="log-game">
                <div class="modal-top">
                    <div class="modal-id">
                        <span class="modal-eyebrow">Log Game</span>
                        <h2 class="log-game-header" id="modal-player-name">Player</h2>
                        <p class="modal-sub" id="modal-player-meta">&mdash;</p>
                    </div>
                    <form method="dialog">
                        <button class="modal-close" aria-label="Close">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M18 6 6 18" />
                                <path d="m6 6 12 12" />
                            </svg>
                        </button>
                    </form>
                </div>

                <div class="modal-season" id="modal-season"></div>

                <form method="dialog" class="game-log-stats hitter" id="hitter-stats">
                    <div class="modal-formhead"><span>This Game</span></div>
                    <div class="stats-container">
                        <label for="AB">AB</label>
                        <input type="number" min="0" id="ab-modal-input" placeholder="0" autofocus>
                    </div>
                    <div class="stats-container">
                        <label for="H">H</label>
                        <input type="number" min="0" id="hits-modal-input" placeholder="0">
                    </div>
                    <div class="stats-container">
                        <label for="HR">HR</label>
                        <input type="number" min="0" id="hr-modal-input" placeholder="0">
                    </div>
                    <div class="stats-container">
                        <label for="RBI">RBI</label>
                        <input type="number" min="0" id="rbi-modal-input" placeholder="0">
                    </div>
                    <div class="stats-container">
                        <label for="R">R</label>
                        <input type="number" min="0" id="runs-modal-input" placeholder="0">
                    </div>
                    <div class="stats-container">
                        <label for="BB">BB</label>
                        <input type="number" min="0" id="bb-modal-input" placeholder="0">
                    </div>

                    <button class="log-game-btn" id="submit-modal" type="button">Submit</button>
                </form>

                <form method="dialog" class="game-log-stats pitcher" id="pitcher-stats">
                    <div class="modal-formhead"><span>This Game</span></div>
                    <div class="stats-container">
                        <label for="IP">IP</label>
                        <input type="number" min="0" id="ip-modal-input" placeholder="0">
                    </div>
                    <div class="stats-container">
                        <label for="K">K</label>
                        <input type="number" min="0" id="k-modal-input" placeholder="0">
                    </div>
                    <div class="stats-container">
                        <label for="H">H</label>
                        <input type="number" min="0" id="pitcher-hits-modal-input" placeholder="0">
                    </div>
                    <div class="stats-container">
                        <label for="BB">BB</label>
                        <input type="number" min="0" id="pitcher-bb-modal-input" placeholder="0">
                    </div>
                    <div class="stats-container">
                        <label for="E">E</label>
                        <input type="number" min="0" id="er-modal-input" placeholder="0">
                    </div>
                    <div class="stats-container">
                        <label for="ERA">ERA</label>
                        <input type="number" min="0" id="era-modal-input" placeholder="0">
                    </div>
                    <button class="log-game-btn" id="submit-modal-pitcher" type="button">Submit</button>
                </form>
            </div>
        </dialog>
    </div>

</body>

</html>
